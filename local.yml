services:
  app:
    build: .
    container_name: flask-template-app
    image: solnustec.com/flask-template:latest
    restart: always
    # Flask dev server with reload; the image runs gunicorn
    command: python main.py
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./:/src
